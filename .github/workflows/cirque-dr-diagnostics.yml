name: Build right Cirque diagnostics
on:
  push:
    branches: [test/cirque-dr-diagnostics]

permissions:
  contents: read

jobs:
  right:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated west workspace
        run: |
          mkdir -p /tmp/cirque-zmk/config
          cp -R config/. /tmp/cirque-zmk/config/
      - name: Fetch pinned ZMK and Cirque sources
        working-directory: /tmp/cirque-zmk
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Instrument Cirque read failures
        working-directory: /tmp/cirque-zmk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path(subprocess.check_output(
              ["west", "list", "-f", "{abspath}", "cirque-input-module"], text=True
          ).strip())
          source = root / "drivers/input/input_pinnacle.c"
          header = source.with_suffix(".h")

          def replace_once(text, before, after):
              if text.count(before) != 1:
                  raise ValueError(f"Expected exactly one occurrence of {before!r}")
              return text.replace(before, after, 1)

          text = source.read_text()
          start = text.index("static void pinnacle_send_rel(")
          end = text.index("static void pinnacle_send_abs(", start)
          send = replace_once(text[start:end],
              "    pinnacle_clear_status(dev);\n    set_int(dev, true);\n\n", "")
          text = text[:start] + send + text[end:]

          start = text.index("static void pinnacle_report_data_rel(")
          end = text.index("static void pinnacle_work_cb(", start)
          report = text[start:end].replace(
              "static void pinnacle_report_data_rel", "static int pinnacle_report_data_rel", 1
          )
          report = replace_once(report,
              '        LOG_ERR("read status: %d", ret);\n        return;',
              "        return ret;")
          report = replace_once(report,
              "    if (packet[0] == 0xFF || !(packet[0] & PINNACLE_STATUS1_SW_DR)) {\n        return;\n    }",
              "    if (packet[0] == 0xFF) {\n        return -EBADMSG;\n    }\n"
              "    if (!(packet[0] & PINNACLE_STATUS1_SW_DR)) {\n        return -EAGAIN;\n    }")
          report = replace_once(report,
              '        LOG_ERR("read packet: %d", ret);\n        return;',
              "        return ret;")
          report = replace_once(report,
              '    LOG_HEXDUMP_DBG(packet, 3, "Pinnacle Packets");',
              "    ret = pinnacle_clear_status(dev);\n"
              "    if (ret < 0) {\n        return ret;\n    }\n\n"
              '    LOG_HEXDUMP_DBG(packet, 3, "Pinnacle Packets");')
          report = replace_once(report,
              "    pinnacle_send_rel(dev, (int8_t) dx, (int8_t) dy);",
              "    pinnacle_send_rel(dev, (int8_t) dx, (int8_t) dy);\n    return 0;")
          text = text[:start] + report + text[end:]

          text = replace_once(text,
              "    struct pinnacle_data *data = CONTAINER_OF(work, struct pinnacle_data, work);",
              "    struct pinnacle_data *data = CONTAINER_OF(\n"
              "        k_work_delayable_from_work(work), struct pinnacle_data, work);")
          text = replace_once(text, "        pinnacle_report_data_rel(dev);", """        int ret = pinnacle_report_data_rel(dev);
                  if (ret < 0) {
                      if (data->last_read_error != ret) {
                          LOG_WRN("Cirque read incomplete: %d (-11 no report, -74 invalid status)", ret);
                      }
                      data->last_read_error = ret;
                      if (gpio_pin_get_dt(&config->dr) != 0) {
                          k_work_reschedule(&data->work, K_MSEC(20));
                          return;
                      }
                  } else if (data->last_read_error != 0) {
                      LOG_INF("Cirque read recovered");
                      data->last_read_error = 0;
                  }

                  ret = set_int(dev, true);
                  if (ret < 0) {
                      k_work_reschedule(&data->work, K_MSEC(20));
                  }""")
          text = replace_once(text, "k_work_submit(&data->work);",
                              "k_work_reschedule(&data->work, K_NO_WAIT);")
          text = replace_once(text, "k_work_init(&data->work, pinnacle_work_cb);",
                              "k_work_init_delayable(&data->work, pinnacle_work_cb);\n"
                              '    LOG_INF("Cirque DR diagnostics active");')
          source.write_text(text)
          text = replace_once(header.read_text(), "struct k_work work;",
                              "struct k_work_delayable work;\n    int last_read_error;")
          header.write_text(text)
          PY
      - name: Build right UF2 with USB logging
        working-directory: /tmp/cirque-zmk
        run: |
          west build -s zmk/app -d build-right -b nice_nano_v2 -S zmk-usb-logging -- \
            -DZMK_CONFIG="$PWD/config" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DSHIELD="Sofle_R nice_oled" -DCONFIG_INPUT_LOG_LEVEL_INF=y
          cp build-right/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/Sofle_R-cirque-dr-diagnostics.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: Sofle_R-cirque-dr-diagnostics
          path: Sofle_R-cirque-dr-diagnostics.uf2
          if-no-files-found: error
