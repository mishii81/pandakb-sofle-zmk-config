name: Build right Cirque circular scroll
on:
  push:
    branches: [test/right-cirque-circular-scroll]

permissions:
  contents: read

jobs:
  right:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated west workspace
        run: |
          mkdir -p /tmp/cirque-zmk/config
          cp -R config/. /tmp/cirque-zmk/config/
      - name: Fetch pinned ZMK and Cirque sources
        working-directory: /tmp/cirque-zmk
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Add Cirque circular scroll and preserve dedicated worker
        working-directory: /tmp/cirque-zmk
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          root = Path(subprocess.check_output(
              ["west", "list", "-f", "{abspath}", "cirque-input-module"], text=True
          ).strip())
          source = root / "drivers/input/input_pinnacle.c"
          header = source.with_suffix(".h")

          def replace_once(text, before, after):
              if text.count(before) != 1:
                  raise ValueError(f"Expected exactly one occurrence of {before!r}")
              return text.replace(before, after, 1)

          text = source.read_text()
          gestures = Path(os.environ["GITHUB_WORKSPACE"]) / "firmware/cirque_gestures.h"
          source.with_name(gestures.name).write_text(gestures.read_text())
          start = text.index("static void pinnacle_send_rel(")
          end = text.index("static void pinnacle_work_cb(", start)
          text = text[:start] + r"""static int pinnacle_report_gestures(const struct device *dev) {
              uint8_t status;
              int ret = pinnacle_seq_read(dev, PINNACLE_STATUS1, &status, 1);
              if (ret < 0) {
                  return ret;
              }
              if (status == 0xFF) {
                  return -EBADMSG;
              }
              if (!(status & PINNACLE_STATUS1_SW_DR)) {
                  return -EAGAIN;
              }

              uint8_t packet[6];
              ret = pinnacle_seq_read(dev, PINNACLE_2_2_PACKET0, packet, sizeof(packet));
              if (ret < 0) {
                  return ret;
              }
              ret = pinnacle_clear_status(dev);
              if (ret < 0) {
                  return ret;
              }

              const struct pinnacle_config *config = dev->config;
              struct pinnacle_data *data = dev->data;
              const bool touching = (packet[5] & 0x3f) != 0;
              const uint16_t x = ((packet[4] & 0x0f) << 8) | packet[2];
              const uint16_t y = ((packet[4] & 0xf0) << 4) | packet[3];
              const struct cirque_gesture_report report =
                  cirque_gesture_sample(&data->gesture, touching, x, y, k_uptime_get_32());

              const uint8_t changed_buttons = (packet[0] ^ data->btn_cache) & 0x07;
              for (int i = 0; i < 3; ++i) {
                  if (changed_buttons & BIT(i)) {
                      input_report_key(dev, INPUT_BTN_0 + i, (packet[0] & BIT(i)) != 0, true, K_FOREVER);
                  }
              }
              data->btn_cache = packet[0];

              if (report.dx) {
                  input_report_rel(dev, INPUT_REL_X, report.dx, report.dy == 0, K_FOREVER);
              }
              if (report.dy) {
                  input_report_rel(dev, INPUT_REL_Y, report.dy, true, K_FOREVER);
              }
              if (report.wheel) {
                  input_report_rel(dev, INPUT_REL_WHEEL, report.wheel, true, K_FOREVER);
              }
              if (report.tap && !config->no_taps && !(packet[0] & PINNACLE_PACKET0_BTN_PRIM)) {
                  input_report_key(dev, INPUT_BTN_0, 1, true, K_FOREVER);
                  input_report_key(dev, INPUT_BTN_0, 0, true, K_FOREVER);
              }

              return 0;
          }

          """ + text[end:]

          start = text.index("    if (config->absolute_mode) {")
          end = text.index("\n}", start)
          text = text[:start] + "        pinnacle_report_data_rel(dev);" + text[end:]

          start = text.index("    uint8_t feed_cfg2 =")
          end = text.index("    if (config->x_invert)", start)
          text = text[:start] + """    ret = pinnacle_write(dev, PINNACLE_FEED_CFG2, 0);
              if (ret < 0) {
                  return ret;
              }
              uint8_t feed_cfg1 = PINNACLE_FEED_CFG1_EN_FEED | PINNACLE_FEED_CFG1_ABS_MODE;
          """ + text[end:]

          text = replace_once(text,
              "    struct pinnacle_data *data = CONTAINER_OF(work, struct pinnacle_data, work);",
              "    struct pinnacle_data *data = CONTAINER_OF(\n"
              "        k_work_delayable_from_work(work), struct pinnacle_data, work);")
          text = replace_once(text, "        pinnacle_report_data_rel(dev);", """        int ret = pinnacle_report_gestures(dev);
                  if (ret < 0) {
                      if (data->last_read_error != ret) {
                          LOG_WRN("Cirque read incomplete: %d (-11 no report, -74 invalid status)", ret);
                      }
                      data->last_read_error = ret;
                      if (gpio_pin_get_dt(&config->dr) != 0) {
                          k_work_reschedule(&data->work, K_MSEC(20));
                          return;
                      }
                  } else if (data->last_read_error != 0) {
                      LOG_INF("Cirque read recovered");
                      data->last_read_error = 0;
                  }

                  ret = set_int(dev, true);
                  if (ret < 0) {
                      k_work_reschedule(&data->work, K_MSEC(20));
                  }""")
          text = replace_once(text, "k_work_submit(&data->work);",
                              "k_work_reschedule(&data->work, K_NO_WAIT);")
          text = replace_once(text, "k_work_init(&data->work, pinnacle_work_cb);",
                              "k_work_init_delayable(&data->work, pinnacle_work_cb);\n"
                              '    LOG_INF("Cirque DR diagnostics active");')
          # Keep I2C and input reporting off the system queue used by matrix scanning.
          text = replace_once(text,
              "LOG_MODULE_REGISTER(pinnacle, CONFIG_INPUT_LOG_LEVEL);",
              "LOG_MODULE_REGISTER(pinnacle, CONFIG_INPUT_LOG_LEVEL);\n\n"
              "BUILD_ASSERT(DT_NUM_INST_STATUS_OKAY(DT_DRV_COMPAT) == 1);\n"
              "static struct k_work_q cirque_work_queue;\n"
              "K_THREAD_STACK_DEFINE(cirque_work_stack, 1536);")
          text = text.replace("k_work_reschedule(&data->work,",
                              "k_work_reschedule_for_queue(&cirque_work_queue, &data->work,")
          text = replace_once(text,
              "    k_work_init_delayable(&data->work, pinnacle_work_cb);",
              "    k_work_queue_start(&cirque_work_queue, cirque_work_stack,\n"
              "                       K_THREAD_STACK_SIZEOF(cirque_work_stack), K_PRIO_PREEMPT(7), NULL);\n"
              "    k_work_init_delayable(&data->work, pinnacle_work_cb);")
          text = replace_once(text,
              "Cirque DR diagnostics active", "Cirque circular scroll and tap active")
          source.write_text(text)
          text = replace_once(header.read_text(), "#pragma once", '#pragma once\n\n#include "cirque_gestures.h"')
          text = replace_once(text, "struct k_work work;",
                              "struct k_work_delayable work;\n    int last_read_error;\n    struct cirque_gesture_state gesture;")
          header.write_text(text)
          PY
      - name: Configure right RGB data pull-down
        run: |
          cat >> boards/shields/Sofle/Sofle_R.overlay <<'DTS'

          &gpio0 {
              rgb_data_pulldown {
                  gpio-hog;
                  gpios = <6 GPIO_PULL_DOWN>;
                  input;
              };
          };
          DTS
      - name: Build right UF2 with USB logging
        working-directory: /tmp/cirque-zmk
        run: |
          west build -s zmk/app -d build-right -b nice_nano_v2 -S zmk-usb-logging -- \
            -DZMK_CONFIG="$PWD/config" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DSHIELD="Sofle_R nice_oled" -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_GPIO_HOGS=y
          grep -qx 'CONFIG_GPIO_HOGS=y' build-right/zephyr/.config
          grep -q 'rgb_data_pulldown' build-right/zephyr/zephyr.dts
          cp build-right/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/Sofle_R-cirque-circular-scroll.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: Sofle_R-cirque-circular-scroll
          path: Sofle_R-cirque-circular-scroll.uf2
          if-no-files-found: error
